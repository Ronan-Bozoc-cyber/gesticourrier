   <script>  
        // Palette de couleurs pour les camemberts de catégories
        const reservedColors = ['#f59e0b', '#10b981']; // Jaune (Arrivé) & Vert (Départ)
        const colorPalette = [
            '#2563eb', '#8b5cf6', '#ec4899', '#06b6d4', '#f59e0b', '#10b981',
            '#6366f1', '#14b8a6', '#f97316', '#a855f7', '#0284c7', '#84cc16',
            '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#6b7280', '#0f172a'
        ];

        // Variables globales pour stocker les graphiques
        let charts = {
            courriersCurrentMonthChart: null,
            courriersSelectedMonthChart: null,
            categoriesArriveCurrentMonthChart: null,
            categoriesArriveSelectedMonthChart: null,
            categoriesDepartCurrentMonthChart: null,
            categoriesDepartSelectedMonthChart: null
        };

        // Fonction pour créer un tableau de données
        function createDataTable(containerId, labels, data) {
            const container = document.getElementById(containerId);
            let tableHTML = '<table style="width:100%; border-collapse:collapse; margin-top:12px; font-size:0.88rem;"><thead><tr style="background:#f8fafc; border-bottom:1.5px solid #cbd5e1;"><th style="padding:8px 12px; text-align:left; color:#334155;">Catégorie / Type</th><th style="padding:8px 12px; text-align:center; color:#334155;">Nombre</th><th style="padding:8px 12px; text-align:right; color:#334155;">Proportion</th></tr></thead><tbody>';

            let sum = data.reduce((a, b) => a + b, 0);

            labels.forEach((label, index) => {
                let percentage = sum > 0 ? Math.round((data[index] / sum) * 100) : 0;
                tableHTML += `<tr style="border-bottom:1px solid #f1f5f9;"><td style="padding:8px 12px; font-weight:600; color:#1e293b;">${label}</td><td style="padding:8px 12px; text-align:center; color:#0f172a;">${data[index]}</td><td style="padding:8px 12px; text-align:right; font-weight:700; color:#2563eb;">${percentage}%</td></tr>`;
            });

            tableHTML += '</tbody></table>';
            container.innerHTML = tableHTML;
        }

        // Fonction pour créer un camembert
        function createPieChart(canvasId, tableId, labels, data, title, isCategoryChart = false) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            // Détruire le graphique existant s'il existe
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            const backgroundColors = isCategoryChart ?
                labels.map((_, index) => colorPalette[index % colorPalette.length]) :
                reservedColors;

            charts[canvasId] = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: backgroundColors,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: false
                        },
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#334155',
                                font: {
                                    size: 12,
                                    weight: '600'
                                }
                            }
                        },
                        datalabels: {
                            color: '#ffffff',
                            formatter: (value, ctx) => {
                                let sum = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                                let percentage = Math.round((value / sum) * 100);
                                return value > 0 ? `${percentage}%\n(${value})` : '';
                            },
                            font: {
                                size: 11,
                                weight: 'bold'
                            }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });

            // Créer le tableau de données
            createDataTable(tableId, labels, data);
        }

        // Fonction pour récupérer les données des courriers pour un mois spécifique
        function fetchCourriersDataForMonth(month) {
            return fetch(`get_statistiques_courriers.php?month=${month}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erreur HTTP: ${response.status}`);
                    }
                    return response.json().catch(error => {
                        console.error('Erreur lors de l\'analyse JSON:', error);
                        throw new Error('Réponse non valide depuis le serveur.');
                    });
                })
                .catch(error => {
                    console.error('Erreur lors de la récupération des données:', error);
                    throw error;
                });
        }

        // Fonction pour mettre à jour les graphiques avec le mois sélectionné
        function updateCharts() {
            const selectedMonth = document.getElementById('monthSelector').value;
            const monthName = new Date(selectedMonth + '-01').toLocaleString('fr-FR', { month: 'long', year: 'numeric' });

            fetchCourriersDataForMonth(selectedMonth)
                .then(data => {
                    createPieChart(
                        'courriersSelectedMonthChart',
                        'courriersSelectedMonthTable',
                        ['Entrants', 'Sortants'],
                        [data.arrive, data.depart],
                        `Courriers - ${monthName}`
                    );

                    if (data.categoriesArrive && Object.keys(data.categoriesArrive).length > 0) {
                        createPieChart(
                            'categoriesArriveSelectedMonthChart',
                            'categoriesArriveSelectedMonthTable',
                            Object.keys(data.categoriesArrive),
                            Object.values(data.categoriesArrive),
                            `Catégories des courriers entrants - ${monthName}`,
                            true
                        );
                    } else {
                        const el = document.getElementById('categoriesArriveSelectedMonthChart');
                        if (el) el.parentElement.innerHTML = `<h2 class="chart-title">Catégories des courriers entrants - ${monthName}</h2><p style="color: #64748b; text-align: center; padding: 20px;">Aucune donnée disponible.</p>`;
                    }

                    if (data.categoriesDepart && Object.keys(data.categoriesDepart).length > 0) {
                        createPieChart(
                            'categoriesDepartSelectedMonthChart',
                            'categoriesDepartSelectedMonthTable',
                            Object.keys(data.categoriesDepart),
                            Object.values(data.categoriesDepart),
                            `Catégories des courriers sortants - ${monthName}`,
                            true
                        );
                    } else {
                        const el = document.getElementById('categoriesDepartSelectedMonthChart');
                        if (el) el.parentElement.innerHTML = `<h2 class="chart-title">Catégories des courriers sortants - ${monthName}</h2><p style="color: #64748b; text-align: center; padding: 20px;">Aucune donnée disponible.</p>`;
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                });
        }

        // Fonction pour récupérer les données des courriers
        function fetchCourriersData() {
            const currentMonth = new Date().toISOString().slice(0, 7);

            fetchCourriersDataForMonth(currentMonth)
                .then(data => {
                    createPieChart(
                        'courriersCurrentMonthChart',
                        'courriersCurrentMonthTable',
                        ['Entrants', 'Sortants'],
                        [data.arrive, data.depart],
                        `Courriers - Mois en cours`
                    );

                    if (data.categoriesArrive && Object.keys(data.categoriesArrive).length > 0) {
                        createPieChart(
                            'categoriesArriveCurrentMonthChart',
                            'categoriesArriveCurrentMonthTable',
                            Object.keys(data.categoriesArrive),
                            Object.values(data.categoriesArrive),
                            `Catégories des courriers entrants - Mois en cours`,
                            true
                        );
                    } else {
                        const el = document.getElementById('categoriesArriveCurrentMonthChart');
                        if (el) el.parentElement.innerHTML = '<h2 class="chart-title">Catégories des courriers entrants - Mois en cours</h2><p style="color: #64748b; text-align: center; padding: 20px;">Aucune donnée disponible.</p>';
                    }

                    if (data.categoriesDepart && Object.keys(data.categoriesDepart).length > 0) {
                        createPieChart(
                            'categoriesDepartCurrentMonthChart',
                            'categoriesDepartCurrentMonthTable',
                            Object.keys(data.categoriesDepart),
                            Object.values(data.categoriesDepart),
                            `Catégories des courriers sortants - Mois en cours`,
                            true
                        );
                    } else {
                        const el = document.getElementById('categoriesDepartCurrentMonthChart');
                        if (el) el.parentElement.innerHTML = '<h2 class="chart-title">Catégories des courriers sortants - Mois en cours</h2><p style="color: #64748b; text-align: center; padding: 20px;">Aucune donnée disponible.</p>';
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                });
        }

        document.addEventListener('DOMContentLoaded', fetchCourriersData);
        </script>
